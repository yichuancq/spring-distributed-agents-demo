<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分布式智能体系统 - Spring AI Alibaba</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 分布式智能体系统</h1>
            <p>基于 Spring AI Alibaba 的 A2A Agent 平台</p>
        </header>

        <main>
            <div class="tabs">
                <button class="tab-btn active" data-tab="chat">对话</button>
                <button class="tab-btn" data-tab="preferences">用户偏好</button>
                <button class="tab-btn" data-tab="history">对话历史</button>
                <button class="tab-btn" data-tab="agents">Agent 列表</button>
            </div>

            <div class="tab-content active" id="chat-tab">
                <div class="chat-section">
                    <div class="chat-controls">
                        <div class="form-group">
                            <label>Agent 名称</label>
                            <select id="agentSelect">
                                <option value="data_analysis_agent">data_analysis_agent (数据分析)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>用户 ID</label>
                            <input type="text" id="userId" value="user001" placeholder="输入用户 ID">
                        </div>
                        <div class="form-group">
                            <label>会话 ID</label>
                            <input type="text" id="sessionId" value="session_default" placeholder="输入会话 ID">
                        </div>
                        <button id="clearSessionBtn" class="btn btn-secondary">清除会话</button>
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <div class="message system-message">
                            <span class="message-icon">💬</span>
                            <div class="message-content">
                                <p>欢迎使用智能体系统！请在下方输入您的问题。</p>
                            </div>
                        </div>
                    </div>

                    <div class="chat-input">
                        <textarea id="userInput" placeholder="输入您的消息..." rows="3"></textarea>
                        <button id="sendBtn" class="btn btn-primary">发送</button>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="preferences-tab">
                <div class="preferences-section">
                    <div class="form-group">
                        <label>用户 ID</label>
                        <input type="text" id="prefUserId" value="user001" placeholder="输入用户 ID">
                        <button id="getPrefsBtn" class="btn btn-primary">获取偏好</button>
                    </div>

                    <div class="form-group">
                        <label>用户偏好（每行一个）</label>
                        <textarea id="preferencesInput" placeholder="例如：&#10;用户喜欢简短直接的回答&#10;用户只说中文&#10;用户关注数据分析" rows="5"></textarea>
                    </div>

                    <button id="setPrefsBtn" class="btn btn-primary">保存偏好</button>

                    <div id="prefResult" class="result-box"></div>
                </div>
            </div>

            <div class="tab-content" id="history-tab">
                <div class="history-section">
                    <div class="form-group">
                        <label>会话 ID</label>
                        <input type="text" id="histSessionId" value="session_default" placeholder="输入会话 ID">
                    </div>
                    <div class="form-group">
                        <label>最大消息数</label>
                        <input type="number" id="maxMessages" value="10" min="1" max="100">
                    </div>
                    <button id="getHistoryBtn" class="btn btn-primary">获取历史</button>

                    <div id="historyResult" class="result-box"></div>
                </div>
            </div>

            <div class="tab-content" id="agents-tab">
                <div class="agents-section">
                    <button id="refreshAgentsBtn" class="btn btn-primary">刷新列表</button>
                    <div id="agentsResult" class="agents-list"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
